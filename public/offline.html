<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>NEXT — لا يوجد اتصال | No connection</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9ff;color:#14213a;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
  main{max-width:26rem;background:#fff;border:1px solid #d9e4f6;border-radius:20px;padding:32px 24px}
  img{width:72px;height:72px;border-radius:16px}

  p{margin:6px 0;color:#4a5a74;line-height:1.7}

<body>
<main>
  <img src="/icons/icon-192.png" alt="NEXT">
  <h1>لا يوجد اتصال بالإنترنت</h1>

  <h1 dir="ltr" lang="en">You are offline</h1>
  <p dir="ltr" lang="en">Check your connection and try again. Nothing was saved.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة · Retry</button>
